<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>PREMIUM VIP • CYBER SECURE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        :root {
            --primary: #00f3ff;
            --secondary: #ff00f3;
            --vip: #ffd700;
            --dark: #03030a;
            --glass: rgba(5, 5, 15, 0.95);
            --glass-light: rgba(10, 10, 25, 0.8);
        }

        body {
            background: var(--dark);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Premium Cyber Background */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .gradient-sphere {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(0, 243, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 0, 243, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 50% 20%, rgba(255, 215, 0, 0.1) 0%, transparent 50%);
        }

        .cyber-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: gridMove 30s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(30px) translateX(30px); }
        }

        .cyber-lines {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .cyber-lines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 20px,
                rgba(0, 243, 255, 0.02) 20px,
                rgba(0, 243, 255, 0.02) 40px
            );
        }

        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
            opacity: 0.5;
            animation: floatParticle 20s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            z-index: 10;
        }

        /* Premium Header */
        .premium-header {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 2px solid var(--primary);
            border-radius: 40px;
            padding: 40px 20px;
            margin: 20px 0 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
        }

        .header-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(0, 243, 255, 0.1) 50%,
                transparent 70%
            );
            animation: headerGlow 8s infinite linear;
        }

        @keyframes headerGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vip-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--vip), #ffaa00);
            color: black;
            padding: 10px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.4em;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 0 40px var(--vip);
            animation: badgePulse 2s infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .premium-header h1 {
            font-size: clamp(2.5em, 8vw, 4em);
            background: linear-gradient(135deg, #fff, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header-subtitle {
            color: #aaa;
            font-size: 1.2em;
            letter-spacing: 2px;
        }

        /* Panels */
        .panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 40px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            display: none;
            animation: panelAppear 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes panelAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .active-panel {
            display: block;
        }

        .panel-title {
            font-size: 2.2em;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        .panel-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        /* Form Elements */
        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .input-field {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #333;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            outline: none;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #0099ff);
            color: black;
            box-shadow: 0 0 30px var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px var(--primary);
        }

        .btn-vip {
            background: linear-gradient(135deg, var(--vip), #ffaa00);
            color: black;
            box-shadow: 0 0 30px var(--vip);
        }

        .btn-vip:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px var(--vip);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff3366, #cc0033);
            color: white;
        }

        /* Tabs */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 120px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: 500;
        }

        .tab:hover, .tab.active {
            border-color: var(--primary);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        /* Cards */
        .link-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .link-card:hover {
            border-color: var(--primary);
            transform: translateX(10px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        .link-info h3 {
            color: var(--primary);
            margin-bottom: 8px;
        }

        .link-meta {
            color: #666;
            font-size: 0.9em;
        }

        .link-url {
            color: var(--primary);
            font-size: 0.85em;
            word-break: break-all;
            margin-top: 5px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .card-btn {
            padding: 10px 20px;
            border: 1px solid #333;
            border-radius: 12px;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .card-btn:hover {
            border-color: var(--primary);
            background: rgba(0, 243, 255, 0.1);
        }

        .card-btn-danger:hover {
            border-color: #ff3366;
            background: rgba(255, 51, 102, 0.1);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-box:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5em;
            color: var(--primary);
            font-weight: bold;
            text-shadow: 0 0 20px var(--primary);
        }

        .stat-label {
            color: #aaa;
            margin-top: 8px;
            font-size: 1.1em;
        }

        /* Video Container - FIXED */
        .video-wrapper {
            margin: 25px 0;
            background: black;
            border-radius: 30px;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        .size-youtube { aspect-ratio: 16/9; }
        .size-tiktok { aspect-ratio: 9/16; max-width: 350px; margin: 0 auto; }
        .size-instagram { aspect-ratio: 1/1; max-width: 400px; margin: 0 auto; }
        .size-facebook { aspect-ratio: 4/3; }

        /* Generated Link */
        .generated-link-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--primary);
            border-radius: 20px;
            word-break: break-all;
            text-align: center;
        }

        .generated-link-box a {
            color: var(--primary);
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
        }

        .generated-link-box a:hover {
            text-decoration: underline;
        }

        /* Password Protected Content */
        .password-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 30px;
            padding: 30px;
            margin: 20px 0;
            border: 1px solid #333;
        }

        /* Alert */
        .alert-popup {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            border-radius: 50px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px solid;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: alertSlide 0.3s ease;
        }

        @keyframes alertSlide {
            from { top: -100px; }
            to { top: 30px; }
        }

        .alert-success { border-color: #00ff88; }
        .alert-error { border-color: #ff3366; }

        /* Loading */
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 243, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Mobile */
        @media (max-width: 768px) {
            .panel { padding: 20px; }
            .tab { min-width: 100%; }
            .link-card { flex-direction: column; gap: 15px; text-align: center; }
            .card-actions { width: 100%; justify-content: center; }
            .stats-grid { grid-template-columns: 1fr; }
            .panel-title { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <!-- Premium Cyber Background -->
    <div class="cyber-bg">
        <div class="gradient-sphere"></div>
        <div class="cyber-grid"></div>
        <div class="cyber-lines"></div>
        <div class="floating-particles" id="particles"></div>
    </div>

    <div class="container">
        <!-- Premium Header -->
        <div class="premium-header">
            <div class="header-glow"></div>
            <div class="vip-badge">★ PREMIUM VIP ★</div>
            <h1>CYBER SECURE</h1>
            <div class="header-subtitle">FILE SHARING SYSTEM</div>
        </div>

        <!-- Admin Login Panel -->
        <div id="adminLogin" class="panel active-panel">
            <h2 class="panel-title">ADMIN LOGIN</h2>
            <div class="input-group">
                <label class="input-label">Admin Password</label>
                <input type="password" id="adminPass" class="input-field" placeholder="Enter password...">
            </div>
            <button class="btn btn-primary" onclick="adminLogin()">ACCESS DASHBOARD</button>
            <p style="text-align: center; margin-top: 20px; color: #666;">Password: MH562100607</p>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminPanel" class="panel">
            <h2 class="panel-title">⚡ ADMIN DASHBOARD</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="totalLinks">0</div>
                    <div class="stat-label">Total Links</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalFiles">0</div>
                    <div class="stat-label">Files</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalViews">0</div>
                    <div class="stat-label">Views</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalPasswords">0</div>
                    <div class="stat-label">Passwords</div>
                </div>
            </div>

            <div class="tab-container">
                <div class="tab active" onclick="switchTab('create')">➕ CREATE LINK</div>
                <div class="tab" onclick="switchTab('passwords')">🔐 VIP PASSWORDS</div>
                <div class="tab" onclick="switchTab('manage')">📋 MANAGE LINKS</div>
            </div>

            <!-- Create Link Tab -->
            <div id="createTab">
                <div class="input-group">
                    <label class="input-label">Title</label>
                    <input type="text" id="linkTitle" class="input-field" placeholder="Enter title...">
                </div>
                <div class="input-group">
                    <label class="input-label">Description</label>
                    <textarea id="linkDesc" class="input-field" rows="4" placeholder="Enter description..."></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">Vimeo Video ID</label>
                    <input type="text" id="vimeoId" class="input-field" placeholder="e.g., 824804225">
                    <small style="color: #666; margin-top: 5px; display: block;">Test ID: 824804225 (Working)</small>
                </div>
                <div class="input-group">
                    <label class="input-label">Video Size</label>
                    <select id="videoSize" class="input-field">
                        <option value="size-youtube">YouTube (16:9)</option>
                        <option value="size-tiktok">TikTok (9:16)</option>
                        <option value="size-instagram">Instagram (1:1)</option>
                        <option value="size-facebook">Facebook (4:3)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">Upload File</label>
                    <input type="file" id="fileUpload" class="input-field">
                </div>
                <button class="btn btn-primary" onclick="createLink()">CREATE LINK</button>
                <div id="generatedLink" class="generated-link-box"></div>
            </div>

            <!-- Passwords Tab -->
            <div id="passwordsTab" style="display: none;">
                <div class="input-group">
                    <label class="input-label">Add VIP Password</label>
                    <input type="text" id="newPassword" class="input-field" placeholder="Enter new password...">
                </div>
                <button class="btn btn-primary" onclick="addPassword()">ADD PASSWORD</button>
                <div id="passwordsList" style="margin-top: 20px;"></div>
            </div>

            <!-- Manage Links Tab -->
            <div id="manageTab" style="display: none;">
                <div id="linksList"></div>
            </div>

            <button class="btn btn-danger" onclick="logout()" style="margin-top: 20px;">LOGOUT</button>
        </div>

        <!-- User Password Panel -->
        <div id="userPasswordPanel" class="panel">
            <h2 class="panel-title">🔐 VIP ACCESS</h2>
            <div class="password-box">
                <div class="input-group">
                    <label class="input-label">Enter VIP Password</label>
                    <input type="password" id="vipPassword" class="input-field" placeholder="Enter password...">
                </div>
                <button class="btn btn-vip" onclick="verifyPassword()">ACCESS CONTENT</button>
            </div>
        </div>

        <!-- Content Panel -->
        <div id="contentPanel" class="panel">
            <div class="loading-spinner" id="loading">
                <div class="spinner"></div>
                <p style="color: var(--primary);">Loading Premium Content...</p>
            </div>
            
            <h2 class="panel-title" id="contentTitle"></h2>
            
            <div class="video-wrapper">
                <iframe id="contentVideo" src="" allowfullscreen></iframe>
            </div>

            <div style="background: rgba(0,0,0,0.4); padding: 25px; border-radius: 20px; margin: 20px 0;">
                <p id="contentDesc" style="line-height: 1.8; color: #ccc;"></p>
            </div>

            <button class="btn btn-vip" id="downloadBtn" onclick="downloadFile()">
                ⬇ DOWNLOAD VIP FILE ⬇
            </button>
        </div>
    </div>

    <script>
        // Initialize Database
        let db = JSON.parse(localStorage.getItem('premiumDB')) || {
            links: {},
            passwords: ['VIP2024', 'SECURE123'], // Default passwords
            adminPass: 'MH562100607'
        };

        let currentLinkId = null;
        let editId = null;

        // Generate Particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 20 + 's';
                p.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }

        // Check URL
        window.onload = function() {
            createParticles();
            
            const params = new URLSearchParams(window.location.search);
            const id = params.get('vip');
            
            if (id && db.links[id]) {
                document.getElementById('adminLogin').classList.remove('active-panel');
                document.getElementById('userPasswordPanel').classList.add('active-panel');
                currentLinkId = id;
            }
            
            updateStats();
        };

        function saveDB() {
            localStorage.setItem('premiumDB', JSON.stringify(db));
            updateStats();
        }

        function updateStats() {
            let links = Object.keys(db.links).length;
            let files = 0;
            let views = 0;
            
            for (let id in db.links) {
                if (db.links[id].file) files++;
                views += db.links[id].views || 0;
            }
            
            document.getElementById('totalLinks').textContent = links;
            document.getElementById('totalFiles').textContent = files;
            document.getElementById('totalViews').textContent = views;
            document.getElementById('totalPasswords').textContent = db.passwords.length;
        }

        function showAlert(msg, type) {
            let alert = document.createElement('div');
            alert.className = `alert-popup alert-${type}`;
            alert.textContent = msg;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        // Admin Functions
        function adminLogin() {
            let pass = document.getElementById('adminPass').value;
            
            if (pass === db.adminPass) {
                document.getElementById('adminLogin').classList.remove('active-panel');
                document.getElementById('adminPanel').classList.add('active-panel');
                renderPasswords();
                renderLinks();
                showAlert('Welcome Admin!', 'success');
            } else {
                showAlert('Invalid Password!', 'error');
            }
        }

        function logout() {
            document.getElementById('adminPanel').classList.remove('active-panel');
            document.getElementById('adminLogin').classList.add('active-panel');
            document.getElementById('adminPass').value = '';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('createTab').style.display = 'none';
            document.getElementById('passwordsTab').style.display = 'none';
            document.getElementById('manageTab').style.display = 'none';
            
            if (tab === 'create') {
                document.getElementById('createTab').style.display = 'block';
            } else if (tab === 'passwords') {
                document.getElementById('passwordsTab').style.display = 'block';
                renderPasswords();
            } else {
                document.getElementById('manageTab').style.display = 'block';
                renderLinks();
            }
        }

        // Password Management
        function addPassword() {
            let newPass = document.getElementById('newPassword').value.trim();
            
            if (!newPass) {
                showAlert('Enter password!', 'error');
                return;
            }
            
            if (db.passwords.includes(newPass)) {
                showAlert('Password already exists!', 'error');
                return;
            }
            
            db.passwords.push(newPass);
            saveDB();
            
            document.getElementById('newPassword').value = '';
            renderPasswords();
            showAlert('Password added!', 'success');
        }

        function renderPasswords() {
            let html = '';
            
            db.passwords.forEach((pass, index) => {
                html += `
                    <div class="link-card">
                        <div class="link-info">
                            <h3>🔑 ${pass}</h3>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn card-btn-danger" onclick="deletePassword(${index})">Delete</button>
                        </div>
                    </div>
                `;
            });
            
            if (db.passwords.length === 0) {
                html = '<p style="text-align:center; color:#666;">No passwords added</p>';
            }
            
            document.getElementById('passwordsList').innerHTML = html;
        }

        function deletePassword(index) {
            if (confirm('Delete this password?')) {
                db.passwords.splice(index, 1);
                saveDB();
                renderPasswords();
                showAlert('Password deleted!', 'success');
            }
        }

        // Link Management
        function createLink() {
            let title = document.getElementById('linkTitle').value.trim();
            let desc = document.getElementById('linkDesc').value.trim();
            let vimeo = document.getElementById('vimeoId').value.trim();
            let size = document.getElementById('videoSize').value;
            let file = document.getElementById('fileUpload').files[0];

            if (!title || !vimeo) {
                showAlert('Title and Vimeo ID required!', 'error');
                return;
            }

            let id = editId || 'VIP_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    saveLink(id, title, desc, vimeo, size, e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            } else {
                let old = editId ? db.links[editId] : null;
                saveLink(id, title, desc, vimeo, size, old ? old.file : null, old ? old.fileName : null);
            }
        }

        function saveLink(id, title, desc, vimeo, size, file, fileName) {
            db.links[id] = {
                title, desc, vimeo, size,
                file: file,
                fileName: fileName,
                created: new Date().toLocaleString(),
                views: 0
            };
            
            saveDB();
            
            let url = window.location.href.split('?')[0] + '?vip=' + id;
            document.getElementById('generatedLink').innerHTML = `
                <strong>✅ LINK CREATED!</strong><br>
                <a href="${url}" target="_blank">${url}</a>
            `;
            
            // Clear form
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkDesc').value = '';
            document.getElementById('vimeoId').value = '';
            document.getElementById('fileUpload').value = '';
            
            editId = null;
            renderLinks();
            showAlert('Link created!', 'success');
        }

        function renderLinks() {
            let html = '';
            
            for (let id in db.links) {
                let link = db.links[id];
                let url = window.location.href.split('?')[0] + '?vip=' + id;
                
                html += `
                    <div class="link-card">
                        <div class="link-info">
                            <h3>${link.title}</h3>
                            <div class="link-meta">Views: ${link.views || 0} | Created: ${link.created}</div>
                            <div class="link-url">${url}</div>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="editLink('${id}')">Edit</button>
                            <button class="card-btn card-btn-danger" onclick="deleteLink('${id}')">Delete</button>
                        </div>
                    </div>
                `;
            }
            
            if (Object.keys(db.links).length === 0) {
                html = '<p style="text-align:center; color:#666;">No links created</p>';
            }
            
            document.getElementById('linksList').innerHTML = html;
        }

        function editLink(id) {
            let link = db.links[id];
            
            document.getElementById('linkTitle').value = link.title;
            document.getElementById('linkDesc').value = link.desc;
            document.getElementById('vimeoId').value = link.vimeo;
            document.getElementById('videoSize').value = link.size;
            
            editId = id;
            switchTab('create');
            showAlert('Editing: ' + link.title, 'success');
        }

        function deleteLink(id) {
            if (confirm('Delete this link?')) {
                delete db.links[id];
                saveDB();
                renderLinks();
                showAlert('Link deleted!', 'success');
            }
        }

        // User Functions
        function verifyPassword() {
            let pass = document.getElementById('vipPassword').value;
            
            if (db.passwords.includes(pass)) {
                document.getElementById('userPasswordPanel').classList.remove('active-panel');
                document.getElementById('contentPanel').classList.add('active-panel');
                loadContent();
            } else {
                showAlert('Invalid Password!', 'error');
            }
        }

        function loadContent() {
            let link = db.links[currentLinkId];
            
            if (!link) return;
            
            document.getElementById('contentTitle').textContent = link.title;
            document.getElementById('contentDesc').textContent = link.desc;
            
            let iframe = document.getElementById('contentVideo');
            iframe.src = `https://player.vimeo.com/video/${link.vimeo}`;
            iframe.className = link.size;
            
            link.views = (link.views || 0) + 1;
            saveDB();
        }

        function downloadFile() {
            let link = db.links[currentLinkId];
            
            if (link && link.file) {
                let a = document.createElement('a');
                a.href = link.file;
                a.download = link.fileName || 'premium-file';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showAlert('Download started!', 'success');
            } else {
                showAlert('No file available!', 'error');
            }
        }
    </script>
</body>
</html>
