<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>VIP PREMIUM • DIRECT ACCESS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --neon: #00ffff;
            --vip: #ffd700;
            --dark: #0a0a0f;
            --glass: rgba(10, 10, 20, 0.95);
        }

        body {
            background: var(--dark);
            color: white;
            min-height: 100vh;
        }

        /* Animated Background */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #000, #0a0a1a);
        }

        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: grid 20s linear infinite;
        }

        @keyframes grid {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        .floating {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .floating div {
            position: absolute;
            width: 200px;
            height: 200px;
            filter: blur(60px);
            opacity: 0.2;
            animation: float 15s infinite;
        }

        .floating div:nth-child(1) {
            top: 10%;
            left: 10%;
            background: var(--neon);
            animation-delay: 0s;
        }

        .floating div:nth-child(2) {
            bottom: 20%;
            right: 10%;
            background: var(--vip);
            animation-delay: -5s;
        }

        @keyframes float {
            0%,100%{ transform: translate(0,0); }
            50%{ transform: translate(30px, -30px); }
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
            position: relative;
        }

        /* Header */
        .header {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px solid var(--neon);
            border-radius: 30px;
            padding: 30px 20px;
            margin: 20px 0;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,255,255,0.3);
        }

        .vip-badge {
            display: inline-block;
            background: var(--vip);
            color: black;
            padding: 8px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 15px;
            box-shadow: 0 0 30px var(--vip);
        }

        .header h1 {
            font-size: clamp(2em, 7vw, 3.5em);
            color: var(--neon);
            text-shadow: 0 0 20px var(--neon);
        }

        /* Panels */
        .panel {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 30px;
            padding: 30px 20px;
            margin-bottom: 20px;
            display: none;
            animation: slide 0.5s ease;
        }

        @keyframes slide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .active {
            display: block;
        }

        .title {
            font-size: 2em;
            text-align: center;
            margin-bottom: 25px;
            color: var(--neon);
            text-shadow: 0 0 15px var(--neon);
        }

        /* Forms */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #333;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--neon);
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            outline: none;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: var(--neon);
            color: black;
            box-shadow: 0 0 30px var(--neon);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px var(--neon);
        }

        .btn-vip {
            background: var(--vip);
            color: black;
            box-shadow: 0 0 30px var(--vip);
        }

        .btn-vip:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px var(--vip);
        }

        .btn-danger {
            background: #ff4444;
            color: white;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }

        .tab:hover, .tab.active {
            border-color: var(--neon);
            background: rgba(0,255,255,0.1);
        }

        /* Cards */
        .card {
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .card:hover {
            border-color: var(--neon);
            transform: translateX(5px);
        }

        .card h4 {
            color: var(--neon);
            margin-bottom: 5px;
        }

        .card small {
            color: #666;
        }

        .card-actions {
            display: flex;
            gap: 5px;
        }

        .card-btn {
            padding: 8px 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .card-btn:hover {
            border-color: var(--neon);
            background: rgba(0,255,255,0.1);
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }

        .stat h3 {
            font-size: 2em;
            color: var(--neon);
        }

        /* Video */
        .video-box {
            margin: 20px 0;
            background: black;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--neon);
        }

        .video-box iframe {
            width: 100%;
            display: block;
        }

        .size-youtube { aspect-ratio: 16/9; }
        .size-tiktok { aspect-ratio: 9/16; max-width: 350px; margin: 0 auto; }
        .size-instagram { aspect-ratio: 1/1; max-width: 400px; margin: 0 auto; }
        .size-facebook { aspect-ratio: 4/3; }

        /* Link Display */
        .link-display {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,255,255,0.1);
            border: 2px solid var(--neon);
            border-radius: 15px;
            word-break: break-all;
            text-align: center;
        }

        .link-display a {
            color: var(--neon);
            text-decoration: none;
            font-weight: bold;
        }

        /* Alert */
        .alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 50px;
            background: var(--glass);
            border: 2px solid;
            color: white;
            z-index: 1000;
            animation: alert 0.3s ease;
        }

        .alert-success { border-color: #00ff00; }
        .alert-error { border-color: #ff4444; }

        @keyframes alert {
            from { top: -100px; }
            to { top: 20px; }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .tabs { flex-direction: column; }
            .stats { grid-template-columns: 1fr; }
            .card { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="grid"></div>
        <div class="floating">
            <div></div>
            <div></div>
        </div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="vip-badge">★ VIP ACCESS ★</div>
            <h1>SECURE FILE SHARE</h1>
            <p style="color: #aaa; margin-top: 10px;">No Login Required • Direct Access</p>
        </div>

        <!-- Admin Login Panel -->
        <div id="adminLogin" class="panel active">
            <h2 class="title">ADMIN LOGIN</h2>
            <div class="input-group">
                <label>Admin Password</label>
                <input type="password" id="adminPass" placeholder="Enter password...">
            </div>
            <button class="btn btn-primary" onclick="login()">LOGIN</button>
            <p style="text-align: center; margin-top: 15px; color: #666;">Password: admin123</p>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminPanel" class="panel">
            <h2 class="title">⚡ ADMIN DASHBOARD</h2>
            
            <div class="stats">
                <div class="stat">
                    <h3 id="totalLinks">0</h3>
                    <p>Total Links</p>
                </div>
                <div class="stat">
                    <h3 id="totalFiles">0</h3>
                    <p>Files</p>
                </div>
                <div class="stat">
                    <h3 id="totalViews">0</h3>
                    <p>Total Views</p>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="showTab('create')">➕ CREATE</div>
                <div class="tab" onclick="showTab('manage')">🔗 MANAGE</div>
            </div>

            <!-- Create Tab -->
            <div id="createTab">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="title" placeholder="Enter title...">
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="desc" rows="4" placeholder="Enter description..."></textarea>
                </div>
                <div class="input-group">
                    <label>Vimeo ID</label>
                    <input type="text" id="vimeo" placeholder="e.g., 824804225">
                </div>
                <div class="input-group">
                    <label>Video Size</label>
                    <select id="size">
                        <option value="size-youtube">YouTube (16:9)</option>
                        <option value="size-tiktok">TikTok (9:16)</option>
                        <option value="size-instagram">Instagram (1:1)</option>
                        <option value="size-facebook">Facebook (4:3)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Upload File</label>
                    <input type="file" id="file">
                </div>
                <button class="btn btn-primary" onclick="createLink()">CREATE LINK</button>
                <div id="linkResult" class="link-display"></div>
            </div>

            <!-- Manage Tab -->
            <div id="manageTab" style="display: none;">
                <div id="linksList"></div>
            </div>

            <button class="btn btn-danger" onclick="logout()" style="margin-top: 20px;">LOGOUT</button>
        </div>

        <!-- Content Panel (Direct Access) -->
        <div id="contentPanel" class="panel">
            <h2 class="title" id="contentTitle"></h2>
            
            <div class="video-box">
                <iframe id="contentVideo" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; margin: 20px 0;">
                <p id="contentDesc" style="line-height: 1.8;"></p>
            </div>

            <button class="btn btn-vip" id="downloadBtn" onclick="downloadFile()">
                ⬇ DOWNLOAD FILE ⬇
            </button>
        </div>
    </div>

    <script>
        // Database
        let db = JSON.parse(localStorage.getItem('vipDB')) || {
            links: {}
        };

        let currentLink = null;
        let editId = null;

        // Check URL
        window.onload = function() {
            let params = new URLSearchParams(window.location.search);
            let id = params.get('vip');
            
            if (id && db.links[id]) {
                document.getElementById('adminLogin').classList.remove('active');
                document.getElementById('contentPanel').classList.add('active');
                currentLink = id;
                loadContent();
            }
            
            updateStats();
        };

        function saveDB() {
            localStorage.setItem('vipDB', JSON.stringify(db));
            updateStats();
        }

        function updateStats() {
            let links = Object.keys(db.links).length;
            let files = 0;
            let views = 0;
            
            for (let id in db.links) {
                if (db.links[id].file) files++;
                views += db.links[id].views || 0;
            }
            
            document.getElementById('totalLinks').textContent = links;
            document.getElementById('totalFiles').textContent = files;
            document.getElementById('totalViews').textContent = views;
        }

        function alert(msg, type) {
            let a = document.createElement('div');
            a.className = `alert alert-${type}`;
            a.textContent = msg;
            document.body.appendChild(a);
            setTimeout(() => a.remove(), 3000);
        }

        // Admin
        function login() {
            let pass = document.getElementById('adminPass').value;
            if (pass === 'admin123') {
                document.getElementById('adminLogin').classList.remove('active');
                document.getElementById('adminPanel').classList.add('active');
                renderLinks();
                alert('Welcome Admin!', 'success');
            } else {
                alert('Wrong password!', 'error');
            }
        }

        function logout() {
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminLogin').classList.add('active');
            document.getElementById('adminPass').value = '';
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'create') {
                document.getElementById('createTab').style.display = 'block';
                document.getElementById('manageTab').style.display = 'none';
            } else {
                document.getElementById('createTab').style.display = 'none';
                document.getElementById('manageTab').style.display = 'block';
                renderLinks();
            }
        }

        // Create Link
        function createLink() {
            let title = document.getElementById('title').value.trim();
            let desc = document.getElementById('desc').value.trim();
            let vimeo = document.getElementById('vimeo').value.trim();
            let size = document.getElementById('size').value;
            let file = document.getElementById('file').files[0];

            if (!title || !vimeo) {
                alert('Title and Vimeo ID required!', 'error');
                return;
            }

            let id = editId || 'VIP_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    saveLink(id, title, desc, vimeo, size, e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            } else {
                let old = editId ? db.links[editId] : null;
                saveLink(id, title, desc, vimeo, size, old ? old.file : null, old ? old.fileName : null);
            }
        }

        function saveLink(id, title, desc, vimeo, size, file, fileName) {
            db.links[id] = {
                title, desc, vimeo, size,
                file: file,
                fileName: fileName,
                created: new Date().toLocaleString(),
                views: 0
            };
            
            saveDB();
            
            let url = window.location.href.split('?')[0] + '?vip=' + id;
            document.getElementById('linkResult').innerHTML = `
                <strong>✅ LINK READY!</strong><br>
                <a href="${url}" target="_blank">${url}</a>
            `;
            
            // Clear form
            document.getElementById('title').value = '';
            document.getElementById('desc').value = '';
            document.getElementById('vimeo').value = '';
            document.getElementById('file').value = '';
            
            editId = null;
            renderLinks();
            alert('Link created!', 'success');
        }

        function renderLinks() {
            let html = '';
            
            for (let id in db.links) {
                let link = db.links[id];
                let url = window.location.href.split('?')[0] + '?vip=' + id;
                
                html += `
                    <div class="card">
                        <div style="flex:1">
                            <h4>${link.title}</h4>
                            <small>Views: ${link.views || 0}</small><br>
                            <small style="color:#666">${url}</small>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="editLink('${id}')">Edit</button>
                            <button class="card-btn" onclick="deleteLink('${id}')" style="border-color:#ff4444">Delete</button>
                        </div>
                    </div>
                `;
            }
            
            if (Object.keys(db.links).length === 0) {
                html = '<p style="text-align:center; color:#666">No links yet</p>';
            }
            
            document.getElementById('linksList').innerHTML = html;
        }

        function editLink(id) {
            let link = db.links[id];
            
            document.getElementById('title').value = link.title;
            document.getElementById('desc').value = link.desc;
            document.getElementById('vimeo').value = link.vimeo;
            document.getElementById('size').value = link.size;
            
            editId = id;
            showTab('create');
            alert('Editing: ' + link.title, 'success');
        }

        function deleteLink(id) {
            if (confirm('Delete this link?')) {
                delete db.links[id];
                saveDB();
                renderLinks();
                alert('Link deleted!', 'success');
            }
        }

        // Content Functions
        function loadContent() {
            let link = db.links[currentLink];
            
            document.getElementById('contentTitle').textContent = link.title;
            document.getElementById('contentDesc').textContent = link.desc;
            
            let iframe = document.getElementById('contentVideo');
            iframe.src = `https://player.vimeo.com/video/${link.vimeo}`;
            iframe.className = link.size;
            
            link.views = (link.views || 0) + 1;
            saveDB();
        }

        function downloadFile() {
            let link = db.links[currentLink];
            
            if (link && link.file) {
                let a = document.createElement('a');
                a.href = link.file;
                a.download = link.fileName || 'download';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                alert('Download started!', 'success');
            } else {
                alert('No file available!', 'error');
            }
        }
    </script>
</body>
</html>
