
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Blue Secure File Share</title>
    <style>
        /* ================= CSS (PREMIUM NEON BLUE DESIGN) ================= */
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #05050f;
            --panel-bg: rgba(10, 10, 25, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #05050f 0%, #000 100%);
        }
        .bg-animation::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(var(--neon-blue) 1px, transparent 1px),
                radial-gradient(var(--neon-blue) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            opacity: 0.1;
            animation: moveBg 10s linear infinite;
        }
        @keyframes moveBg {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Container & Panels */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            display: none; /* Controlled via JS */
            margin-bottom: 20px;
        }

        .active-panel { display: block; }

        h1, h2, h3 {
            color: var(--neon-blue);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        /* Buttons */
        .btn {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
            text-align: center;
            width: 100%;
        }
        .btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }
        .btn-danger {
            border-color: #ff003c;
            color: #ff003c;
        }
        .btn-danger:hover {
            background: #ff003c;
            color: #fff;
            box-shadow: 0 0 20px #ff003c;
        }

        /* Video Sizes */
        .video-container { display: flex; justify-content: center; margin-bottom: 20px; background: #000; }
        .size-youtube { width: 100%; aspect-ratio: 16/9; }
        .size-tiktok { width: 300px; aspect-ratio: 9/16; }
        .size-instagram { width: 400px; aspect-ratio: 1/1; }
        .size-facebook { width: 100%; aspect-ratio: 4/3; }

        /* Generated Link Card */
        .link-card {
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
        }

        /* Tab switch */
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="bg-animation"></div>

<div class="container">
    
    <!-- 1. ADMIN LOGIN PANEL -->
    <div id="adminLoginPanel" class="panel active-panel">
        <h2>Admin Login</h2>
        <p style="text-align:center; color:#ccc; margin-bottom:10px;">(Password is 'admin' for demo)</p>
        <div class="form-group">
            <input type="password" id="adminPassword" placeholder="Enter Admin Password">
        </div>
        <button class="btn" onclick="loginAdmin()">Login Admin</button>
    </div>

    <!-- 2. ADMIN DASHBOARD -->
    <div id="adminDashboard" class="panel">
        <h1>Admin Control Panel</h1>
        
        <div class="admin-tabs">
            <button class="btn" onclick="showAdminSection('createLinkSection')">Create New Link</button>
            <button class="btn" onclick="showAdminSection('manageUsersSection')">Manage Users</button>
            <button class="btn" onclick="showAdminSection('manageLinksSection')">Manage Links</button>
        </div>

        <!-- Create Link Section -->
        <div id="createLinkSection" style="display:block;">
            <h3>Create / Edit Link</h3>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="linkTitle" placeholder="Enter Title (e.g., Premium APK)">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="linkDesc" rows="4" placeholder="Enter file details..."></textarea>
            </div>
            <div class="form-group">
                <label>Vimeo Video ID (e.g., 824804225)</label>
                <input type="text" id="vimeoId" placeholder="Enter Video ID">
            </div>
            <div class="form-group">
                <label>Video Size / Format</label>
                <select id="videoSize">
                    <option value="size-youtube">YouTube (16:9)</option>
                    <option value="size-tiktok">TikTok / Reels (9:16)</option>
                    <option value="size-instagram">Instagram Post (1:1)</option>
                    <option value="size-facebook">Facebook (4:3)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Upload File (ZIP, APK, etc.)</label>
                <!-- Limit size conceptually, large files in LocalStorage crash browser -->
                <input type="file" id="fileUpload"> 
            </div>
            <button class="btn" onclick="generateLink()">Create / Save Link</button>
            <p id="generatedLinkResult" style="margin-top:15px; color:var(--neon-blue); text-align:center; word-break: break-all;"></p>
        </div>

        <!-- Manage Users Section -->
        <div id="manageUsersSection" style="display:none;">
            <h3>Authorized Users Access</h3>
            <div class="form-group">
                <input type="text" id="userName" placeholder="User Name">
            </div>
            <div class="form-group">
                <input type="email" id="userEmail" placeholder="User Gmail">
            </div>
            <button class="btn" onclick="addUser()">Add User</button>
            <div id="userList" style="margin-top:20px;"></div>
        </div>

        <!-- Manage Links Section -->
        <div id="manageLinksSection" style="display:none;">
            <h3>All Created Links</h3>
            <div id="linksList"></div>
        </div>
    </div>

    <!-- 3. USER GATE (LOGIN TO ACCESS LINK) -->
    <div id="userGatePanel" class="panel">
        <h2>Access Secure Link</h2>
        <p style="text-align:center; color:#aaa; margin-bottom:15px;">Admin must grant access to your Name & Gmail first.</p>
        <div class="form-group">
            <input type="text" id="guestName" placeholder="Your Name">
        </div>
        <div class="form-group">
            <input type="email" id="guestEmail" placeholder="Your Gmail">
        </div>
        <button class="btn" onclick="verifyUser()">Verify Access</button>
    </div>

    <!-- 4. FINAL CONTENT PAGE (WHAT USER SEES) -->
    <div id="contentPanel" class="panel">
        <h1 id="displayTitle">Title Here</h1>
        
        <div class="video-container">
            <iframe id="displayVideo" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <p id="displayDesc" style="line-height: 1.6;"></p>
        </div>

        <button class="btn" id="downloadBtn" onclick="downloadFile()">⬇ AUTOMATIC DOWNLOAD ⬇</button>
    </div>

</div>

<!-- ================= JAVASCRIPT LOGIC ================= -->
<script>
    // System Database (Using LocalStorage for single-file functionality)
    let db = JSON.parse(localStorage.getItem('neonAppDB')) || {
        users: [],
        links: {}
    };

    let currentEditingLinkId = null;
    let currentViewingLink = null;

    // --- Routing System ---
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');

        if (linkId) {
            // If URL has an ID, show User Gate
            document.getElementById('adminLoginPanel').classList.remove('active-panel');
            document.getElementById('userGatePanel').classList.add('active-panel');
            currentViewingLink = linkId;
        }
    }

    function saveDB() {
        try {
            localStorage.setItem('neonAppDB', JSON.stringify(db));
        } catch (e) {
            alert("Error: File is too large. LocalStorage has a 5MB limit. In a real backend website, this limit does not exist.");
        }
    }

    // --- Admin Functions ---
    function loginAdmin() {
        let pass = document.getElementById('adminPassword').value;
        if(pass === 'admin') {
            document.getElementById('adminLoginPanel').classList.remove('active-panel');
            document.getElementById('adminDashboard').classList.add('active-panel');
            renderUsers();
            renderLinks();
        } else {
            alert("Wrong Password!");
        }
    }

    function showAdminSection(sectionId) {
        document.getElementById('createLinkSection').style.display = 'none';
        document.getElementById('manageUsersSection').style.display = 'none';
        document.getElementById('manageLinksSection').style.display = 'none';
        document.getElementById(sectionId).style.display = 'block';
    }

    // --- User Access System ---
    function addUser() {
        let name = document.getElementById('userName').value.trim();
        let email = document.getElementById('userEmail').value.trim();
        if(name && email) {
            db.users.push({name, email});
            saveDB();
            document.getElementById('userName').value = '';
            document.getElementById('userEmail').value = '';
            renderUsers();
        } else {
            alert("Please fill name and email");
        }
    }

    function renderUsers() {
        let html = '';
        db.users.forEach((u, index) => {
            html += `<div class="link-card">
                        <span>${u.name} (${u.email})</span>
                        <button class="btn btn-danger" style="width:auto; padding:5px 10px" onclick="deleteUser(${index})">Delete</button>
                     </div>`;
        });
        document.getElementById('userList').innerHTML = html;
    }

    function deleteUser(index) {
        db.users.splice(index, 1);
        saveDB();
        renderUsers();
    }

    // --- Link Creation System ---
    function generateLink() {
        let title = document.getElementById('linkTitle').value;
        let desc = document.getElementById('linkDesc').value;
        let vimeoId = document.getElementById('vimeoId').value;
        let videoSize = document.getElementById('videoSize').value;
        let fileInput = document.getElementById('fileUpload');

        if(!title || !vimeoId) return alert("Title and Vimeo ID are required!");

        let linkId = currentEditingLinkId ? currentEditingLinkId : 'NBL_' + Math.random().toString(36).substr(2, 9);
        
        // Handle File to Base64 (so it can be downloaded later)
        if(fileInput.files.length > 0) {
            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = function(e) {
                let fileData = e.target.result;
                saveLinkData(linkId, title, desc, vimeoId, videoSize, fileData, file.name);
            };
            reader.readAsDataURL(file);
        } else {
            // Keep old file if editing and no new file uploaded
            let oldFileData = currentEditingLinkId && db.links[currentEditingLinkId] ? db.links[currentEditingLinkId].fileData : null;
            let oldFileName = currentEditingLinkId && db.links[currentEditingLinkId] ? db.links[currentEditingLinkId].fileName : null;
            saveLinkData(linkId, title, desc, vimeoId, videoSize, oldFileData, oldFileName);
        }
    }

    function saveLinkData(id, title, desc, vimeoId, videoSize, fileData, fileName) {
        db.links[id] = { title, desc, vimeoId, videoSize, fileData, fileName };
        saveDB();
        
        let fullLink = window.location.href.split('?')[0] + "?id=" + id;
        document.getElementById('generatedLinkResult').innerHTML = `Link Created!<br><a href="${fullLink}" target="_blank" style="color:var(--neon-blue)">${fullLink}</a>`;
        
        // Reset form
        currentEditingLinkId = null;
        renderLinks();
    }

    function renderLinks() {
        let html = '';
        for (let id in db.links) {
            let fullLink = window.location.href.split('?')[0] + "?id=" + id;
            html += `<div class="link-card">
                        <div style="flex:1">
                            <strong>${db.links[id].title}</strong><br>
                            <small><a href="${fullLink}" target="_blank" style="color:#aaa;">${fullLink}</a></small>
                        </div>
                        <div>
                            <button class="btn" style="width:auto; padding:5px 10px; border-color:#fff; color:#fff;" onclick="editLink('${id}')">Edit</button>
                            <button class="btn btn-danger" style="width:auto; padding:5px 10px" onclick="deleteLink('${id}')">Delete</button>
                        </div>
                     </div>`;
        }
        document.getElementById('linksList').innerHTML = html;
    }

    function deleteLink(id) {
        delete db.links[id];
        saveDB();
        renderLinks();
    }

    function editLink(id) {
        currentEditingLinkId = id;
        let data = db.links[id];
        document.getElementById('linkTitle').value = data.title;
        document.getElementById('linkDesc').value = data.desc;
        document.getElementById('vimeoId').value = data.vimeoId;
        document.getElementById('videoSize').value = data.videoSize;
        showAdminSection('createLinkSection');
    }

    // --- User Front-End System ---
    function verifyUser() {
        let name = document.getElementById('guestName').value.trim();
        let email = document.getElementById('guestEmail').value.trim();

        // Check against allowed users
        let isAllowed = db.users.find(u => u.name.toLowerCase() === name.toLowerCase() && u.email.toLowerCase() === email.toLowerCase());

        if(isAllowed) {
            loadContentPage();
        } else {
            alert("Access Denied! Your Name or Gmail is not authorized by the Admin.");
        }
    }

    function loadContentPage() {
        let data = db.links[currentViewingLink];
        if(!data) return alert("Link not found or deleted!");

        document.getElementById('userGatePanel').classList.remove('active-panel');
        document.getElementById('contentPanel').classList.add('active-panel');

        document.getElementById('displayTitle').innerText = data.title;
        document.getElementById('displayDesc').innerText = data.desc;
        
        // Setup Vimeo & Size
        let iframe = document.getElementById('displayVideo');
        iframe.src = `https://player.vimeo.com/video/${data.vimeoId}`;
        iframe.className = data.videoSize; // This applies the TikTok/YT/IG sizes
    }

    // Automatically download file on click
    function downloadFile() {
        let data = db.links[currentViewingLink];
        if(data && data.fileData) {
            let a = document.createElement("a");
            a.href = data.fileData;
            a.download = data.fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } else {
            alert("No file attached to this link.");
        }
    }
</script>

</body>
</html>
