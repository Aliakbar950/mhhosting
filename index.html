<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>VIP PREMIUM • SECURE FILE SHARE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --primary: #00ffff;
            --primary-dark: #00cccc;
            --secondary: #ff00ff;
            --vip: #ffd700;
            --dark: #0a0a0f;
            --darker: #050508;
            --glass: rgba(10, 10, 20, 0.95);
            --glass-light: rgba(20, 20, 40, 0.8);
        }

        body {
            background: var(--darker);
            color: white;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Premium Background */
        .premium-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .gradient-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                        linear-gradient(135deg, var(--darker) 0%, #0a0a1a 100%);
        }

        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .float-element {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 15s infinite;
        }

        .element1 {
            top: 10%;
            left: 10%;
            background: var(--primary);
            animation-delay: 0s;
        }

        .element2 {
            bottom: 20%;
            right: 10%;
            background: var(--secondary);
            animation-delay: -5s;
        }

        .element3 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--vip);
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            position: relative;
            z-index: 10;
        }

        /* VIP Header */
        .vip-header {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 30px;
            padding: 30px 20px;
            margin: 20px 0 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
        }

        .vip-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(0, 255, 255, 0.1) 50%,
                transparent 70%
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vip-badge {
            display: inline-block;
            background: linear-gradient(45deg, var(--vip), #ffaa00);
            color: #000;
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
            box-shadow: 0 0 30px var(--vip);
        }

        .vip-header h1 {
            font-size: clamp(2em, 8vw, 3.5em);
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .vip-header p {
            color: #aaa;
            font-size: 1.1em;
        }

        /* Panels */
        .panel {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            display: none;
            animation: panelFade 0.5s ease;
        }

        @keyframes panelFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .active-panel {
            display: block;
        }

        .panel-title {
            font-size: 1.8em;
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Form Elements */
        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            outline: none;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
        }

        .btn-vip {
            background: linear-gradient(135deg, var(--vip), #ffaa00);
            color: #000;
            box-shadow: 0 0 30px var(--vip);
        }

        .btn-vip:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px var(--vip);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
        }

        .btn-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: white;
        }

        .btn-tab:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .btn-tab.active {
            border-color: var(--primary);
            background: rgba(0, 255, 255, 0.1);
        }

        /* Tabs */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .tab:hover {
            border-color: var(--primary);
        }

        .tab.active {
            border-color: var(--primary);
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        /* Cards */
        .user-card, .link-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .user-card:hover, .link-card:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .user-info h4 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .user-info p {
            color: #aaa;
            font-size: 0.9em;
        }

        .link-info {
            flex: 1;
        }

        .link-info h4 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .link-url {
            color: #666;
            font-size: 0.8em;
            word-break: break-all;
        }

        .card-actions {
            display: flex;
            gap: 5px;
        }

        .card-btn {
            padding: 8px 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .card-btn:hover {
            border-color: var(--primary);
            background: rgba(0, 255, 255, 0.1);
        }

        .card-btn-danger:hover {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            color: var(--primary);
            font-weight: bold;
        }

        .stat-label {
            color: #aaa;
            margin-top: 5px;
        }

        /* Video Container */
        .video-container {
            margin: 20px 0;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--primary);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            display: block;
        }

        .size-youtube { aspect-ratio: 16/9; }
        .size-tiktok { aspect-ratio: 9/16; max-width: 350px; margin: 0 auto; }
        .size-instagram { aspect-ratio: 1/1; max-width: 400px; margin: 0 auto; }
        .size-facebook { aspect-ratio: 4/3; }

        /* Generated Link */
        .generated-link {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid var(--primary);
            border-radius: 15px;
            word-break: break-all;
            text-align: center;
        }

        .generated-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        /* Alert */
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            max-width: 400px;
            margin: 0 auto;
            padding: 15px 20px;
            border-radius: 15px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px solid;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .alert-success { border-color: #00ff00; }
        .alert-error { border-color: #ff4444; }

        @keyframes slideIn {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .container { padding: 10px; }
            
            .vip-header { padding: 20px 15px; }
            
            .tab { min-width: 100%; }
            
            .user-card, .link-card {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .card-actions {
                width: 100%;
                justify-content: center;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .btn { padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="premium-bg">
        <div class="gradient-bg"></div>
        <div class="grid-overlay"></div>
        <div class="floating-elements">
            <div class="float-element element1"></div>
            <div class="float-element element2"></div>
            <div class="float-element element3"></div>
        </div>
    </div>

    <div class="container">
        <!-- VIP Header -->
        <div class="vip-header">
            <div class="vip-badge">★ PREMIUM VIP ★</div>
            <h1>SECURE FILE SHARE</h1>
            <p>Advanced Cyber Security System • 100% Working</p>
        </div>

        <!-- Admin Login Panel -->
        <div id="adminLoginPanel" class="panel active-panel">
            <h2 class="panel-title">ADMIN LOGIN</h2>
            <div class="input-group">
                <label class="input-label">Admin Password</label>
                <input type="password" id="adminPass" class="input-field" placeholder="Enter admin password...">
            </div>
            <button class="btn btn-primary" onclick="loginAdmin()">Login to Dashboard</button>
            <p style="text-align: center; margin-top: 15px; color: #666;">Default Password: admin123</p>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" class="panel">
            <h2 class="panel-title">⚡ ADMIN DASHBOARD</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">VIP Users</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalLinks">0</div>
                    <div class="stat-label">Total Links</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalFiles">0</div>
                    <div class="stat-label">Files</div>
                </div>
            </div>

            <div class="tab-container">
                <div class="tab active" onclick="switchTab('create')">➕ CREATE LINK</div>
                <div class="tab" onclick="switchTab('users')">👥 MANAGE USERS</div>
                <div class="tab" onclick="switchTab('links')">🔗 MANAGE LINKS</div>
            </div>

            <!-- Create Link Section -->
            <div id="createSection">
                <div class="input-group">
                    <label class="input-label">Title</label>
                    <input type="text" id="linkTitle" class="input-field" placeholder="Enter title...">
                </div>
                <div class="input-group">
                    <label class="input-label">Description</label>
                    <textarea id="linkDesc" class="input-field" rows="4" placeholder="Enter description..."></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">Vimeo Video ID</label>
                    <input type="text" id="vimeoId" class="input-field" placeholder="e.g., 824804225">
                </div>
                <div class="input-group">
                    <label class="input-label">Video Size</label>
                    <select id="videoSize" class="input-field">
                        <option value="size-youtube">YouTube (16:9)</option>
                        <option value="size-tiktok">TikTok (9:16)</option>
                        <option value="size-instagram">Instagram (1:1)</option>
                        <option value="size-facebook">Facebook (4:3)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">Upload File</label>
                    <input type="file" id="fileUpload" class="input-field">
                </div>
                <button class="btn btn-primary" onclick="createLink()">CREATE VIP LINK</button>
                <div id="generatedLink" class="generated-link"></div>
            </div>

            <!-- Users Section -->
            <div id="usersSection" style="display: none;">
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <input type="text" id="userName" class="input-field" placeholder="Enter name...">
                </div>
                <div class="input-group">
                    <label class="input-label">Gmail Address</label>
                    <input type="email" id="userEmail" class="input-field" placeholder="Enter Gmail...">
                </div>
                <button class="btn btn-primary" onclick="addUser()">ADD VIP USER</button>
                <div id="usersList" style="margin-top: 20px;"></div>
            </div>

            <!-- Links Section -->
            <div id="linksSection" style="display: none;">
                <div id="linksList"></div>
            </div>

            <button class="btn btn-danger" onclick="logoutAdmin()" style="margin-top: 20px;">LOGOUT</button>
        </div>

        <!-- User Login Panel -->
        <div id="userLoginPanel" class="panel">
            <h2 class="panel-title">🔐 VIP MEMBER LOGIN</h2>
            <div class="input-group">
                <label class="input-label">Full Name</label>
                <input type="text" id="loginName" class="input-field" placeholder="Enter your name...">
            </div>
            <div class="input-group">
                <label class="input-label">Gmail Address</label>
                <input type="email" id="loginEmail" class="input-field" placeholder="Enter your Gmail...">
            </div>
            <button class="btn btn-vip" onclick="verifyVIP()">ACCESS VIP CONTENT</button>
        </div>

        <!-- Content Panel -->
        <div id="contentPanel" class="panel">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading VIP Content...</p>
            </div>
            
            <h2 class="panel-title" id="contentTitle"></h2>
            
            <div class="video-container">
                <iframe id="contentVideo" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; margin: 20px 0;">
                <p id="contentDesc" style="line-height: 1.8;"></p>
            </div>

            <button class="btn btn-vip" id="downloadBtn" onclick="downloadFile()">
                ⬇ DOWNLOAD VIP FILE ⬇
            </button>
        </div>
    </div>

    <script>
        // Initialize Database
        let db = JSON.parse(localStorage.getItem('vipDatabase')) || {
            users: [],
            links: {},
            adminPass: 'admin123'
        };

        let currentLinkId = null;
        let editingLinkId = null;

        // Check URL for link ID
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const linkId = params.get('vip');
            
            if (linkId && db.links[linkId]) {
                document.getElementById('adminLoginPanel').classList.remove('active-panel');
                document.getElementById('userLoginPanel').classList.add('active-panel');
                currentLinkId = linkId;
            }
            
            updateStats();
        };

        function saveDB() {
            localStorage.setItem('vipDatabase', JSON.stringify(db));
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalUsers').textContent = db.users.length;
            document.getElementById('totalLinks').textContent = Object.keys(db.links).length;
            
            let files = 0;
            for (let id in db.links) {
                if (db.links[id].file) files++;
            }
            document.getElementById('totalFiles').textContent = files;
        }

        function showAlert(msg, type) {
            let alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = msg;
            document.body.appendChild(alert);
            
            setTimeout(() => alert.remove(), 3000);
        }

        // Admin Functions
        function loginAdmin() {
            let pass = document.getElementById('adminPass').value;
            
            if (pass === db.adminPass) {
                document.getElementById('adminLoginPanel').classList.remove('active-panel');
                document.getElementById('adminDashboard').classList.add('active-panel');
                renderUsers();
                renderLinks();
                showAlert('Login Successful!', 'success');
            } else {
                showAlert('Invalid Password!', 'error');
            }
        }

        function logoutAdmin() {
            document.getElementById('adminDashboard').classList.remove('active-panel');
            document.getElementById('adminLoginPanel').classList.add('active-panel');
            document.getElementById('adminPass').value = '';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('createSection').style.display = 'none';
            document.getElementById('usersSection').style.display = 'none';
            document.getElementById('linksSection').style.display = 'none';
            
            if (tab === 'create') {
                document.getElementById('createSection').style.display = 'block';
            } else if (tab === 'users') {
                document.getElementById('usersSection').style.display = 'block';
                renderUsers();
            } else if (tab === 'links') {
                document.getElementById('linksSection').style.display = 'block';
                renderLinks();
            }
        }

        // User Management
        function addUser() {
            let name = document.getElementById('userName').value.trim();
            let email = document.getElementById('userEmail').value.trim().toLowerCase();
            
            if (!name || !email) {
                showAlert('Please fill all fields!', 'error');
                return;
            }
            
            if (!email.includes('@gmail.com')) {
                showAlert('Only Gmail addresses allowed!', 'error');
                return;
            }
            
            if (db.users.find(u => u.email === email)) {
                showAlert('User already exists!', 'error');
                return;
            }
            
            db.users.push({ name, email });
            saveDB();
            
            document.getElementById('userName').value = '';
            document.getElementById('userEmail').value = '';
            
            renderUsers();
            showAlert('VIP User Added!', 'success');
        }

        function renderUsers() {
            let html = '';
            
            db.users.forEach((user, index) => {
                html += `
                    <div class="user-card">
                        <div class="user-info">
                            <h4>${user.name}</h4>
                            <p>${user.email}</p>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn card-btn-danger" onclick="deleteUser(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });
            
            if (db.users.length === 0) {
                html = '<p style="text-align: center; color: #666;">No VIP users added yet.</p>';
            }
            
            document.getElementById('usersList').innerHTML = html;
        }

        function deleteUser(index) {
            if (confirm('Remove this VIP user?')) {
                db.users.splice(index, 1);
                saveDB();
                renderUsers();
                showAlert('User Removed!', 'success');
            }
        }

        // Link Management
        function createLink() {
            let title = document.getElementById('linkTitle').value.trim();
            let desc = document.getElementById('linkDesc').value.trim();
            let vimeoId = document.getElementById('vimeoId').value.trim();
            let videoSize = document.getElementById('videoSize').value;
            let file = document.getElementById('fileUpload').files[0];
            
            if (!title || !vimeoId) {
                showAlert('Title and Vimeo ID required!', 'error');
                return;
            }
            
            let linkId = editingLinkId || 'VIP_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    saveLink(linkId, title, desc, vimeoId, videoSize, e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            } else {
                let oldData = editingLinkId ? db.links[editingLinkId] : null;
                saveLink(linkId, title, desc, vimeoId, videoSize, 
                        oldData ? oldData.file : null, 
                        oldData ? oldData.fileName : null);
            }
        }

        function saveLink(id, title, desc, vimeoId, videoSize, file, fileName) {
            db.links[id] = {
                title, desc, vimeoId, videoSize,
                file: file,
                fileName: fileName,
                created: new Date().toLocaleString(),
                views: 0
            };
            
            saveDB();
            
            let url = window.location.href.split('?')[0] + '?vip=' + id;
            document.getElementById('generatedLink').innerHTML = `
                <strong>✅ VIP Link Created!</strong><br>
                <a href="${url}" target="_blank">${url}</a>
            `;
            
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkDesc').value = '';
            document.getElementById('vimeoId').value = '';
            document.getElementById('fileUpload').value = '';
            
            editingLinkId = null;
            renderLinks();
            showAlert('Link Created!', 'success');
        }

        function renderLinks() {
            let html = '';
            
            for (let id in db.links) {
                let link = db.links[id];
                let url = window.location.href.split('?')[0] + '?vip=' + id;
                
                html += `
                    <div class="link-card">
                        <div class="link-info">
                            <h4>${link.title}</h4>
                            <p style="color: #aaa;">${link.desc.substring(0, 50)}...</p>
                            <div class="link-url">${url}</div>
                            <small style="color: #666;">Views: ${link.views || 0}</small>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="editLink('${id}')">Edit</button>
                            <button class="card-btn card-btn-danger" onclick="deleteLink('${id}')">Delete</button>
                        </div>
                    </div>
                `;
            }
            
            if (Object.keys(db.links).length === 0) {
                html = '<p style="text-align: center; color: #666;">No links created yet.</p>';
            }
            
            document.getElementById('linksList').innerHTML = html;
        }

        function editLink(id) {
            let link = db.links[id];
            
            document.getElementById('linkTitle').value = link.title;
            document.getElementById('linkDesc').value = link.desc;
            document.getElementById('vimeoId').value = link.vimeoId;
            document.getElementById('videoSize').value = link.videoSize;
            
            editingLinkId = id;
            switchTab('create');
            
            showAlert('Editing: ' + link.title, 'success');
        }

        function deleteLink(id) {
            if (confirm('Delete this link?')) {
                delete db.links[id];
                saveDB();
                renderLinks();
                showAlert('Link Deleted!', 'success');
            }
        }

        // VIP User Functions
        function verifyVIP() {
            let name = document.getElementById('loginName').value.trim().toLowerCase();
            let email = document.getElementById('loginEmail').value.trim().toLowerCase();
            
            if (!name || !email) {
                showAlert('Please enter name and Gmail!', 'error');
                return;
            }
            
            let user = db.users.find(u => 
                u.name.toLowerCase() === name && 
                u.email.toLowerCase() === email
            );
            
            if (user) {
                loadVIPContent();
            } else {
                showAlert('Access Denied! Not a VIP member.', 'error');
            }
        }

        function loadVIPContent() {
            let link = db.links[currentLinkId];
            
            if (!link) {
                showAlert('Link not found!', 'error');
                return;
            }
            
            link.views = (link.views || 0) + 1;
            saveDB();
            
            document.getElementById('userLoginPanel').classList.remove('active-panel');
            document.getElementById('contentPanel').classList.add('active-panel');
            
            document.getElementById('contentTitle').textContent = link.title;
            document.getElementById('contentDesc').textContent = link.desc;
            
            let iframe = document.getElementById('contentVideo');
            iframe.src = `https://player.vimeo.com/video/${link.vimeoId}`;
            iframe.className = link.videoSize;
        }

        function downloadFile() {
            let link = db.links[currentLinkId];
            
            if (link && link.file) {
                let a = document.createElement('a');
                a.href = link.file;
                a.download = link.fileName || 'vip_file';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showAlert('Download Started!', 'success');
            } else {
                showAlert('No file available!', 'error');
            }
        }
    </script>
</body>
</html>
