<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP SECURE FILE SHARE • CYBER GRID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        :root {
            --neon-blue: #00ffff;
            --neon-purple: #9933ff;
            --dark-bg: #0a0a0f;
            --grid-color: rgba(0, 255, 255, 0.1);
            --vip-gold: #ffd700;
        }

        body {
            background: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Cyber Grid Animation */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(var(--dark-bg), var(--dark-bg));
            overflow: hidden;
        }

        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 0%, var(--dark-bg) 100%);
        }

        @keyframes gridMove {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(50px) translateX(50px); }
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: floatParticle 15s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* VIP Header */
        .vip-header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            animation: glowPulse 2s infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px var(--neon-blue); }
            50% { box-shadow: 0 0 50px var(--neon-blue); }
        }

        .vip-header::before {
            content: '★ VIP ★';
            position: absolute;
            top: 10px;
            right: 20px;
            color: var(--vip-gold);
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--vip-gold);
            animation: rotate 5s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vip-header h1 {
            font-size: 3em;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            margin-bottom: 10px;
        }

        .vip-header p {
            color: #ccc;
            font-size: 1.2em;
        }

        /* Panels */
        .panel {
            background: rgba(10, 10, 20, 0.9);
            border: 1px solid var(--neon-blue);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .active-panel {
            display: block;
        }

        h2, h3 {
            color: var(--neon-blue);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            outline: none;
        }

        /* Buttons */
        .btn {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            display: inline-block;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 30px var(--neon-blue);
            transform: translateY(-2px);
        }

        .btn-danger {
            border-color: #ff3366;
            color: #ff3366;
        }

        .btn-danger:hover {
            background: #ff3366;
            color: #fff;
            box-shadow: 0 0 30px #ff3366;
        }

        .btn-vip {
            border-color: var(--vip-gold);
            color: var(--vip-gold);
        }

        .btn-vip:hover {
            background: var(--vip-gold);
            color: #000;
            box-shadow: 0 0 30px var(--vip-gold);
        }

        /* Tabs */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-tabs .btn {
            flex: 1;
            min-width: 120px;
        }

        /* Cards */
        .link-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .link-card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .user-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .user-name {
            color: var(--neon-blue);
            font-weight: bold;
        }

        .user-email {
            color: #aaa;
            font-size: 14px;
        }

        /* Video Container */
        .video-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
        }

        .size-youtube { width: 100%; aspect-ratio: 16/9; }
        .size-tiktok { width: 300px; aspect-ratio: 9/16; margin: 0 auto; }
        .size-instagram { width: 400px; aspect-ratio: 1/1; margin: 0 auto; }
        .size-facebook { width: 100%; aspect-ratio: 4/3; }

        /* Stats */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            color: var(--neon-blue);
            font-weight: bold;
        }

        .stat-label {
            color: #aaa;
            margin-top: 5px;
        }

        /* Generated Link */
        .generated-link {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            word-break: break-all;
            text-align: center;
        }

        .generated-link a {
            color: var(--neon-blue);
            text-decoration: none;
        }

        .generated-link a:hover {
            text-decoration: underline;
        }

        /* Alert Messages */
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            animation: slideIn 0.5s ease;
        }

        .alert-success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .alert-error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-top-color: var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .vip-header h1 {
                font-size: 2em;
            }
            
            .admin-tabs {
                flex-direction: column;
            }
            
            .link-card {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .size-tiktok, .size-instagram {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Cyber Grid Background -->
    <div class="cyber-grid">
        <div class="grid-lines"></div>
        <div class="grid-overlay"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="container">
        <!-- VIP Header -->
        <div class="vip-header">
            <h1>⚡ VIP SECURE SHARE ⚡</h1>
            <p>Premium File Sharing System • Cyber Grid Security</p>
        </div>

        <!-- Admin Login Panel -->
        <div id="adminLoginPanel" class="panel active-panel">
            <h2>🔐 ADMIN LOGIN</h2>
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password...">
            </div>
            <button class="btn" onclick="loginAdmin()">Login to Dashboard</button>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" class="panel">
            <h2>⚙️ ADMIN DASHBOARD</h2>
            
            <!-- Stats -->
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalLinks">0</div>
                    <div class="stat-label">Total Links</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalFiles">0</div>
                    <div class="stat-label">Files Uploaded</div>
                </div>
            </div>

            <div class="admin-tabs">
                <button class="btn" onclick="showAdminSection('createLinkSection')">➕ Create Link</button>
                <button class="btn" onclick="showAdminSection('manageUsersSection')">👥 Manage Users</button>
                <button class="btn" onclick="showAdminSection('manageLinksSection')">🔗 Manage Links</button>
            </div>

            <!-- Create Link Section -->
            <div id="createLinkSection" style="display: block;">
                <h3>Create New VIP Link</h3>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="linkTitle" placeholder="Enter title...">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="linkDesc" rows="4" placeholder="Enter description..."></textarea>
                </div>
                <div class="form-group">
                    <label>Vimeo Video ID</label>
                    <input type="text" id="vimeoId" placeholder="e.g., 824804225">
                </div>
                <div class="form-group">
                    <label>Video Size</label>
                    <select id="videoSize">
                        <option value="size-youtube">YouTube (16:9)</option>
                        <option value="size-tiktok">TikTok (9:16)</option>
                        <option value="size-instagram">Instagram (1:1)</option>
                        <option value="size-facebook">Facebook (4:3)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Upload File (ZIP, APK, PDF, etc.)</label>
                    <input type="file" id="fileUpload">
                </div>
                <button class="btn" onclick="generateLink()">Generate VIP Link</button>
                <div id="generatedLinkResult" class="generated-link"></div>
            </div>

            <!-- Manage Users Section -->
            <div id="manageUsersSection" style="display: none;">
                <h3>Manage VIP Users</h3>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" placeholder="Enter user name...">
                </div>
                <div class="form-group">
                    <label>Gmail Address</label>
                    <input type="email" id="userEmail" placeholder="Enter Gmail...">
                </div>
                <button class="btn" onclick="addUser()">Add VIP User</button>
                <div id="userList" style="margin-top: 20px;"></div>
            </div>

            <!-- Manage Links Section -->
            <div id="manageLinksSection" style="display: none;">
                <h3>All VIP Links</h3>
                <div id="linksList"></div>
            </div>
        </div>

        <!-- User Login Panel -->
        <div id="userLoginPanel" class="panel">
            <h2>🔑 VIP MEMBER LOGIN</h2>
            <p style="text-align: center; color: var(--vip-gold); margin-bottom: 20px;">★ Enter your VIP credentials ★</p>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="loginName" placeholder="Enter your name...">
            </div>
            <div class="form-group">
                <label>Gmail Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your Gmail...">
            </div>
            <button class="btn btn-vip" onclick="verifyVIP()">Access VIP Content</button>
        </div>

        <!-- Content Panel -->
        <div id="contentPanel" class="panel">
            <div class="spinner" id="loadingSpinner"></div>
            <h2 id="displayTitle">VIP Content</h2>
            
            <div class="video-container">
                <iframe id="displayVideo" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px; margin: 20px 0;">
                <p id="displayDesc" style="line-height: 1.8;"></p>
            </div>

            <button class="btn btn-vip" id="downloadBtn" onclick="downloadVIPFile()">
                ⬇ DOWNLOAD VIP FILE ⬇
            </button>
        </div>
    </div>

    <script>
        // Initialize Database
        let db = JSON.parse(localStorage.getItem('vipSecureDB')) || {
            users: [],
            links: {},
            adminPassword: 'admin123' // Default admin password
        };

        let currentLinkId = null;
        let currentEditingLink = null;
        let currentVIPLink = null;

        // Generate Particles
        function generateParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize
        window.onload = function() {
            generateParticles();
            checkURLParams();
            updateStats();
        };

        function saveDB() {
            localStorage.setItem('vipSecureDB', JSON.stringify(db));
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalUsers').textContent = db.users.length;
            document.getElementById('totalLinks').textContent = Object.keys(db.links).length;
            
            let filesCount = 0;
            for (let id in db.links) {
                if (db.links[id].fileData) filesCount++;
            }
            document.getElementById('totalFiles').textContent = filesCount;
        }

        function checkURLParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get('vip');

            if (linkId && db.links[linkId]) {
                document.getElementById('adminLoginPanel').classList.remove('active-panel');
                document.getElementById('userLoginPanel').classList.add('active-panel');
                currentVIPLink = linkId;
            }
        }

        // Admin Login
        function loginAdmin() {
            let password = document.getElementById('adminPassword').value;
            
            if (password === db.adminPassword) {
                document.getElementById('adminLoginPanel').classList.remove('active-panel');
                document.getElementById('adminDashboard').classList.add('active-panel');
                renderUsers();
                renderLinks();
                showAlert('Login successful!', 'success');
            } else {
                showAlert('Invalid password!', 'error');
            }
        }

        function showAdminSection(sectionId) {
            document.getElementById('createLinkSection').style.display = 'none';
            document.getElementById('manageUsersSection').style.display = 'none';
            document.getElementById('manageLinksSection').style.display = 'none';
            document.getElementById(sectionId).style.display = 'block';
            
            if (sectionId === 'manageUsersSection') renderUsers();
            if (sectionId === 'manageLinksSection') renderLinks();
        }

        // User Management
        function addUser() {
            let name = document.getElementById('userName').value.trim();
            let email = document.getElementById('userEmail').value.trim();

            if (!name || !email) {
                showAlert('Please fill all fields!', 'error');
                return;
            }

            if (!email.includes('@gmail.com')) {
                showAlert('Please use Gmail address!', 'error');
                return;
            }

            // Check if user already exists
            let existingUser = db.users.find(u => u.email.toLowerCase() === email.toLowerCase());
            if (existingUser) {
                showAlert('User already exists!', 'error');
                return;
            }

            db.users.push({ 
                name: name, 
                email: email.toLowerCase(),
                added: new Date().toLocaleString()
            });
            
            saveDB();
            document.getElementById('userName').value = '';
            document.getElementById('userEmail').value = '';
            renderUsers();
            showAlert('VIP User added successfully!', 'success');
        }

        function renderUsers() {
            let html = '';
            db.users.forEach((user, index) => {
                html += `
                    <div class="user-card">
                        <div class="user-info">
                            <span class="user-name">${user.name}</span>
                            <span class="user-email">${user.email}</span>
                            <small style="color: #666;">Added: ${user.added || 'N/A'}</small>
                        </div>
                        <button class="btn btn-danger" style="width: auto; padding: 8px 15px;" onclick="deleteUser(${index})">
                            Remove
                        </button>
                    </div>
                `;
            });

            if (db.users.length === 0) {
                html = '<p style="text-align: center; color: #666;">No VIP users added yet.</p>';
            }

            document.getElementById('userList').innerHTML = html;
        }

        function deleteUser(index) {
            if (confirm('Remove this VIP user?')) {
                db.users.splice(index, 1);
                saveDB();
                renderUsers();
                showAlert('User removed successfully!', 'success');
            }
        }

        // Link Management
        function generateLink() {
            let title = document.getElementById('linkTitle').value.trim();
            let desc = document.getElementById('linkDesc').value.trim();
            let vimeoId = document.getElementById('vimeoId').value.trim();
            let videoSize = document.getElementById('videoSize').value;
            let fileInput = document.getElementById('fileUpload');

            if (!title || !vimeoId) {
                showAlert('Title and Vimeo ID are required!', 'error');
                return;
            }

            let linkId = currentEditingLink || 'VIP_' + Math.random().toString(36).substr(2, 9).toUpperCase();

            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                
                // Check file size (max 50MB for localStorage)
                if (file.size > 50 * 1024 * 1024) {
                    showAlert('File too large! Maximum 50MB.', 'error');
                    return;
                }

                let reader = new FileReader();
                reader.onload = function(e) {
                    saveLink(linkId, title, desc, vimeoId, videoSize, e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            } else {
                // Keep existing file if editing
                let oldFile = currentEditingLink && db.links[currentEditingLink] ? 
                    db.links[currentEditingLink].fileData : null;
                let oldFileName = currentEditingLink && db.links[currentEditingLink] ? 
                    db.links[currentEditingLink].fileName : null;
                saveLink(linkId, title, desc, vimeoId, videoSize, oldFile, oldFileName);
            }
        }

        function saveLink(id, title, desc, vimeoId, videoSize, fileData, fileName) {
            db.links[id] = {
                title: title,
                desc: desc,
                vimeoId: vimeoId,
                videoSize: videoSize,
                fileData: fileData,
                fileName: fileName,
                created: new Date().toLocaleString(),
                views: 0
            };

            saveDB();
            
            let fullUrl = window.location.href.split('?')[0] + '?vip=' + id;
            document.getElementById('generatedLinkResult').innerHTML = `
                <strong>✅ VIP Link Created!</strong><br>
                <a href="${fullUrl}" target="_blank">${fullUrl}</a>
            `;

            // Reset form
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkDesc').value = '';
            document.getElementById('vimeoId').value = '';
            document.getElementById('fileUpload').value = '';
            currentEditingLink = null;

            renderLinks();
            showAlert('VIP Link created successfully!', 'success');
        }

        function renderLinks() {
            let html = '';
            
            for (let id in db.links) {
                let link = db.links[id];
                let fullUrl = window.location.href.split('?')[0] + '?vip=' + id;
                
                html += `
                    <div class="link-card">
                        <div style="flex: 1;">
                            <strong style="color: var(--neon-blue);">${link.title}</strong>
                            <br>
                            <small style="color: #aaa;">Created: ${link.created || 'N/A'}</small>
                            <br>
                            <small style="color: #666;">Views: ${link.views || 0}</small>
                            <br>
                            <small><a href="${fullUrl}" target="_blank" style="color: #00ffff;">${fullUrl}</a></small>
                        </div>
                        <div style="display: flex; gap: 5px;">
                            <button class="btn" style="width: auto; padding: 8px 15px;" onclick="editLink('${id}')">
                                Edit
                            </button>
                            <button class="btn btn-danger" style="width: auto; padding: 8px 15px;" onclick="deleteLink('${id}')">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            }

            if (Object.keys(db.links).length === 0) {
                html = '<p style="text-align: center; color: #666;">No links created yet.</p>';
            }

            document.getElementById('linksList').innerHTML = html;
        }

        function editLink(id) {
            currentEditingLink = id;
            let link = db.links[id];
            
            document.getElementById('linkTitle').value = link.title;
            document.getElementById('linkDesc').value = link.desc;
            document.getElementById('vimeoId').value = link.vimeoId;
            document.getElementById('videoSize').value = link.videoSize;
            
            showAdminSection('createLinkSection');
            showAlert('Editing link: ' + link.title, 'success');
        }

        function deleteLink(id) {
            if (confirm('Delete this VIP link?')) {
                delete db.links[id];
                saveDB();
                renderLinks();
                showAlert('Link deleted successfully!', 'success');
            }
        }

        // VIP User Verification
        function verifyVIP() {
            let name = document.getElementById('loginName').value.trim();
            let email = document.getElementById('loginEmail').value.trim().toLowerCase();

            if (!name || !email) {
                showAlert('Please enter your name and Gmail!', 'error');
                return;
            }

            // Check if user is authorized
            let authorizedUser = db.users.find(u => 
                u.name.toLowerCase() === name.toLowerCase() && 
                u.email.toLowerCase() === email.toLowerCase()
            );

            if (authorizedUser) {
                loadVIPContent();
            } else {
                showAlert('Access Denied! You are not a VIP member.', 'error');
            }
        }

        function loadVIPContent() {
            let linkData = db.links[currentVIPLink];
            
            if (!linkData) {
                showAlert('Link not found!', 'error');
                return;
            }

            // Increment view count
            linkData.views = (linkData.views || 0) + 1;
            saveDB();

            document.getElementById('userLoginPanel').classList.remove('active-panel');
            document.getElementById('contentPanel').classList.add('active-panel');

            document.getElementById('displayTitle').textContent = linkData.title;
            document.getElementById('displayDesc').textContent = linkData.desc;

            let iframe = document.getElementById('displayVideo');
            iframe.src = `https://player.vimeo.com/video/${linkData.vimeoId}`;
            iframe.className = linkData.videoSize;
        }

        function downloadVIPFile() {
            let linkData = db.links[currentVIPLink];
            
            if (linkData && linkData.fileData) {
                let a = document.createElement('a');
                a.href = linkData.fileData;
                a.download = linkData.fileName || 'vip_file';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showAlert('Download started!', 'success');
            } else {
                showAlert('No file attached to this link!', 'error');
            }
        }

        // Utility Functions
        function showAlert(message, type) {
            let alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            document.querySelector('.container').insertBefore(alertDiv, document.querySelector('.container').firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        // Admin logout
        function logoutAdmin() {
            document.getElementById('adminDashboard').classList.remove('active-panel');
            document.getElementById('adminLoginPanel').classList.add('active-panel');
            document.getElementById('adminPassword').value = '';
        }

        // Add logout button to admin dashboard
        function addLogoutButton() {
            let logoutBtn = document.createElement('button');
            logoutBtn.className = 'btn btn-danger';
            logoutBtn.style.marginTop = '20px';
            logoutBtn.textContent = 'Logout';
            logoutBtn.onclick = logoutAdmin;
            
            document.getElementById('adminDashboard').appendChild(logoutBtn);
        }

        // Call this after admin dashboard is shown
        setTimeout(addLogoutButton, 100);
    </script>
</body>
</html>
